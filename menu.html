<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./scripts/theme.js"></script>
  <script src="./scripts/navigation.js" defer></script>
  <script src="./scripts/catalog.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&amp;display=swap"
  >
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="icon" href="./assets/icons/logo.svg" type="image/svg+xml">
  <title>Menu | Coffee House</title>
</head>

<body>
  <header class="site-header container">
    <a class="site-header__logo" href="./index.html">
      <img class="site-header__logo-light" src="./assets/icons/logo.svg" alt="Coffee House" width="100" height="60">
      <img class="site-header__logo-dark" src="./assets/icons/logo-dark.svg" alt="Coffee House" width="100" height="60">
    </a>

    <nav class="site-nav" id="primary-navigation" aria-label="Primary navigation">
      <ul class="site-nav__list">
        <li><a href="./index.html#favorite-coffee">Favorite coffee</a></li>
        <li><a href="./index.html#about">About</a></li>
        <li><a href="./index.html#mobile-app">Mobile app</a></li>
        <li><a href="./index.html#contacts">Contact us</a></li>
        <li><a href="./menu.html" aria-current="page">Menu</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
        <span class="theme-toggle__light" aria-hidden="true"></span>
        <span class="theme-toggle__dark" aria-hidden="true"></span>
      </button>
      <button class="menu-toggle" type="button" aria-label="Toggle navigation menu" aria-controls="primary-navigation"
        aria-expanded="false">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="menu container">
    <h1 class="menu__heading">Behind each of our cups hides an <span class="menu__accent">amazing surprise</span></h1>
    <div class="menu__categories" role="group" aria-label="Product categories">
      <button class="menu__category" type="button" data-category="coffee" aria-pressed="true"><span class="menu__category-icon" aria-hidden="true">☕</span>Coffee</button>
      <button class="menu__category" type="button" data-category="tea" aria-pressed="false"><span class="menu__category-icon" aria-hidden="true">🫖</span>Tea</button>
      <button class="menu__category" type="button" data-category="dessert" aria-pressed="false"><span class="menu__category-icon" aria-hidden="true">🍰</span>Dessert</button>
    </div>

    <p class="menu__status" role="status">Loading products…</p>
    <ul class="menu__products" aria-label="Coffee products">
    </ul>
    <button class="menu__show-more" type="button">Show more</button>
  </main>

  <footer class="site-footer container" id="contacts">
    <div class="site-footer__inner">
    <div class="site-footer__brand">
      <h2>Sip, Savor, Smile. <span class="site-footer__accent">It’s coffee time!</span></h2>
      <ul class="site-footer__socials" aria-label="Social media">
        <li>
          <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter"></a>
        </li>
        <li>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"></a>
        </li>
        <li>
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook"></a>
        </li>
      </ul>
    </div>

    <div class="site-footer__contacts">
      <h3>Contact us</h3>
      <address class="site-footer__address">
        <a href="https://www.google.com/maps/search/?api=1&amp;query=8558%20Green%20Rd%2C%20Los%20Angeles"
          target="_blank" rel="noopener noreferrer">
          8558 Green Rd., LA
        </a>
        <a href="tel:+16035550123">+1 (603) 555-0123</a>
      </address>
      <p class="site-footer__hours">Mon-Sat: <time datetime="09:00">9:00</time>–<time datetime="23:00">23:00</time></p>
    </div>
    </div>
  </footer>
</body>

</html>
